; PN532 ESP32-C3 Terminal
; https://github.com/timiliris/pn532-esp32c3-terminal

[platformio]
default_envs = c3

[esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
; Two 1.9 MB app slots: room for over-the-air updates
board_build.partitions = min_spiffs.csv
lib_deps =
  olikraus/U8g2 @ ^2.36
  bblanchon/ArduinoJson @ ^7.2
  ESP32Async/ESPAsyncWebServer @ ^3.7
  ESP32Async/AsyncTCP @ ^3.4
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  !python3 scripts/version.py

; Default build: 0.96" SSD1306 display
[env:c3]
extends = esp32

; 1.3" displays usually use the SH1106 controller
[env:c3-sh1106]
extends = esp32
build_flags =
  ${esp32.build_flags}
  -DDISPLAY_SH1106

; Unit tests of the hardware-independent code: pio test -e native
[env:native]
platform = native
build_flags = -std=c++17
build_src_filter = -<*> +<ndef.cpp>
test_build_src = yes
